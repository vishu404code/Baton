<!doctype html>
<meta charset="utf-8" />
<title>Baton</title>
<style>
  html, body { height: 100%; margin: 0; background: #0B0C0F; color: #E6E7EB; font: 14px -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 40px; }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: #1D1F27; border: 1px solid #6366F1; display: grid; place-items: center; font-weight: 700; font-size: 24px; color: #818CF8; }
  .spin { width: 22px; height: 22px; border: 3px solid #2A2D37; border-top-color: #6366F1; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #msg { color: #8B8FA3; font-size: 13px; max-width: 520px; line-height: 1.5; white-space: pre-wrap; }
  .err #msg { color: #EF4444; } .err .spin { display: none; }
  code { background: #1D1F27; padding: 2px 6px; border-radius: 6px; font-size: 12px; color: #E6E7EB; }
</style>
<div class="wrap" id="root">
  <div class="logo">B</div>
  <div class="spin"></div>
  <div id="msg">Starting Baton…</div>
</div>
<script>
  window.setStatus = (text, isError) => {
    document.getElementById('msg').textContent = text;
    document.getElementById('root').className = 'wrap' + (isError ? ' err' : '');
  };
</script>
