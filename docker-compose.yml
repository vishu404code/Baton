name: baton

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baton}
      POSTGRES_DB: ${POSTGRES_DB:-baton}
    volumes:
      - baton_pgdata:/var/lib/postgresql/data
    # Postgres stays inside the Docker network. Uncomment to debug from the host.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baton} -d ${POSTGRES_DB:-baton}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baton}:${POSTGRES_PASSWORD:-baton}@db:5432/${POSTGRES_DB:-baton}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BATON_PORT:-8000}:8000"
    volumes:
      # Source is mounted so code changes need only `docker compose restart backend`.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/tests:/app/tests
      - ./scripts:/app/scripts:ro
      # Demo seed writes the invite code and demo agent tokens here (gitignored).
      - ./.baton:/app/.baton

volumes:
  baton_pgdata:
